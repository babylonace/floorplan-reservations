version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Stay on Node 24 LTS types until the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 for now.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Only LTS (even) Node versions. Moving to the next LTS is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
